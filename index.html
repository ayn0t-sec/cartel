<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C_Cartel.ng - Luxury Bags in Nigeria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #D4AF37; --black: #0a0a0a; --gray: #111; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--black); color: #fff; font-family: 'Inter', sans-serif; }

  header {
    padding: 25px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
    position: sticky; top: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); z-index: 10;
  }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--gold); }

 .hero {
    height: 70vh;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1591561954557-26941169b49e?q=80&w=2070') center/cover;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
 .hero h2 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin-bottom: 10px; }
 .hero p { font-size: 1.1rem; color: #ccc; margin-bottom: 25px; }
 .btn { background: var(--gold); color: #000; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; }

 .container { max-width: 1300px; margin: 60px auto; padding: 0 5%; }
 .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.2rem; margin-bottom: 40px; }
 .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }

 .card {
    background: var(--gray);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #222;
    transition: transform 0.3s;
  }
 .card:hover { transform: translateY(-8px); border-color: var(--gold); }
 .card img { width: 100%; height: 380px; object-fit: cover; }
 .card-body { padding: 20px; }
 .card-body h3 { font-size: 1.2rem; margin-bottom: 8px; font-weight: 600; }
 .price { font-weight: bold; font-size: 1.3rem; color: var(--gold); margin-bottom: 5px; }
 .category { font-size: 0.9rem; color: #aaa; }
 .badge { display: inline-block; background: var(--gold); color: #000; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-top: 10px; }

 .admin-link { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #000; padding: 14px 22px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
 .loading { text-align: center; padding: 60px; color: #aaa; }
 .error-msg { text-align: center; padding: 40px; color: #ff6b6b; background: rgba(255, 107, 107, 0.1); border-radius: 8px; }
 footer { text-align: center; padding: 40px 20px; border-top: 1px solid #222; color: #777; margin-top: 60px; }
</style>
</head>
<body>

<header>
  <h1>C_CARTEL.NG</h1>
  <nav><a href="/admin.html" style="color:#fff; text-decoration:none;">Admin</a></nav>
</header>

<section class="hero">
  <div>
    <h2>Luxury, Redefined</h2>
    <p>Curated designer bags delivered across Nigeria</p>
    <a href="#products" class="btn">Shop Collection</a>
  </div>
</section>

<section class="container" id="products">
  <h2 class="section-title">New Arrivals</h2>
  <div class="grid" id="productGrid">
    <div class="loading">Loading bags...</div>
  </div>
</section>

<a href="/admin.html" class="admin-link">+ Add Bag</a>

<footer>
  © 2026 C_Cartel.ng. All rights reserved. Abuja, Nigeria.
</footer>

<script>
  // Use environment variables (set in Netlify dashboard)
  const SUPABASE_URL = window.location.origin.includes('localhost') 
    ? 'https://acedquitkeerhzoaktku.supabase.co'
    : (import.meta?.env?.VITE_SUPABASE_URL || 'https://acedquitkeerhzoaktku.supabase.co')
  
  const SUPABASE_ANON_KEY = window.location.origin.includes('localhost')
    ? 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZWRxdWl0a2Vlcmh6b2FrdGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDQwNTQsImV4cCI6MjEwMDkyMDA1NH0.BSH6QPFqdGyZc0WzG1vlU4P1pwdP7i-lzGYObuOPskk'
    : (import.meta?.env?.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZWRxdWl0a2Vlcmh6b2FrdGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDQwNTQsImV4cCI6MjEwMDkyMDA1NH0.BSH6QPFqdGyZc0WzG1vlU4P1pwdP7i-lzGYObuOPskk')

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  async function loadProducts() {
    try {
      const { data, error } = await supabase
        .from('Products')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        console.error('Supabase error:', error)
        document.getElementById('productGrid').innerHTML = `
          <div class="error-msg">
            <p>⚠️ Error loading products</p>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #bbb;">Check console for details. Supabase table or permissions may be misconfigured.</p>
          </div>
        `
        return
      }

      if (data.length === 0) {
        document.getElementById('productGrid').innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No bags yet. Add one from Admin.</p>'
        return
      }

      const grid = document.getElementById('productGrid')
      grid.innerHTML = data.map(p => `
        <div class="card">
          <img src="${p.image_url}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=Image+Not+Found'">
          <div class="card-body">
            <h3>${escapeHtml(p.name)}</h3>
            <div class="price">₦${Number(p.price).toLocaleString()}</div>
            <div class="category">${escapeHtml(p.category)}</div>
            ${p.badge ? `<div class="badge">${escapeHtml(p.badge)}</div>` : ''}
          </div>
        </div>
      `).join('')
    } catch (err) {
      console.error('Unexpected error:', err)
      document.getElementById('productGrid').innerHTML = '<div class="error-msg">An unexpected error occurred</div>'
    }
  }

  // Prevent XSS attacks
  function escapeHtml(unsafe) {
    return unsafe
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
  }

  loadProducts()
</script>

</body>
</html>
