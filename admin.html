<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - BagBox</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FF6B9D;
      --secondary: #00D4FF;
      --accent: #FFD700;
      --dark: #1A1A2E;
      --light: #F8F9FA;
      --success: #4CAF50;
      --danger: #F44336;
      --warning: #FF9800;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--dark);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* HEADER */
    .admin-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 40px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header h1 {
      font-size: 2rem;
    }

    .back-btn {
      background: rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.5);
    }

    /* ALERTS */
    .alert {
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alert.success {
      background: #E8F5E9;
      color: #2E7D32;
      border-left: 4px solid var(--success);
    }

    .alert.error {
      background: #FFEBEE;
      color: #C62828;
      border-left: 4px solid var(--danger);
    }

    .alert.info {
      background: #E3F2FD;
      color: #1565C0;
      border-left: 4px solid var(--secondary);
    }

    .alert-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .alert-close:hover {
      opacity: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FORM SECTION */
    .form-section {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }

    .form-section h2 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: var(--dark);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--dark);
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      padding: 14px;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
      background: #FAFAFA;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="file"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    .file-preview {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #666;
    }

    .file-preview strong {
      color: var(--success);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      padding: 16px 40px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .submit-btn.loading {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PRODUCTS LIST */
    .products-section {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .products-section h2 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: var(--dark);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .product-item {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .product-image-admin {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .product-details {
      padding: 20px;
    }

    .product-name-admin {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .product-meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 6px;
    }

    .product-price-admin {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 10px 0;
    }

    .delete-btn {
      width: 100%;
      background: linear-gradient(135deg, #F44336 0%, #E91E63 100%);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s;
      margin-top: 12px;
    }

    .delete-btn:hover {
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state p {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .loading-products {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .admin-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .admin-header h1 {
        font-size: 1.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-section,
      .products-section {
        padding: 25px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="admin-header">
    <h1>🎀 Admin Dashboard</h1>
    <a href="/" class="back-btn">← Back to Store</a>
  </div>

  <div id="alertContainer"></div>

  <div class="form-section">
    <h2>Add New Bag</h2>
    <form id="bagForm">
      <div class="form-row">
        <div class="form-group">
          <label for="bagName">Bag Name *</label>
          <input type="text" id="bagName" placeholder="e.g., Classic Leather Tote" required minlength="2">
        </div>
        <div class="form-group">
          <label for="bagPrice">Price (₦) *</label>
          <input type="number" id="bagPrice" placeholder="e.g., 75000" required min="1000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="bagCategory">Category *</label>
          <select id="bagCategory" required>
            <option value="">Select Category</option>
            <option value="Totes">Totes</option>
            <option value="Crossbody">Crossbody</option>
            <option value="Clutches">Clutches</option>
            <option value="Backpacks">Backpacks</option>
            <option value="Shoulder">Shoulder</option>
            <option value="Handbags">Handbags</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bagBadge">Badge (Optional)</label>
          <input type="text" id="bagBadge" placeholder="e.g., NEW, SALE, LIMITED" maxlength="20">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label for="bagImage">Bag Image *</label>
          <input type="file" id="bagImage" accept="image/*" required>
          <div class="file-preview" id="filePreview"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Upload Bag
      </button>
    </form>
  </div>

  <div class="products-section">
    <h2>Current Bags</h2>
    <div class="products-grid" id="productsContainer">
      <div class="loading-products">Loading bags...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://acedquitkeerhzoaktku.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZWRxdWl0a2Vlcmh6b2FrdGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDQwNTQsImV4cCI6MjEwMDkyMDA1NH0.BSH6QPFqdGyZc0WzG1vlU4P1pwdP7i-lzGYObuOPskk'

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  // Alert System
  function showAlert(message, type = 'error') {
    const container = document.getElementById('alertContainer')
    const alert = document.createElement('div')
    alert.className = `alert ${type}`
    alert.innerHTML = `
      <span>${message}</span>
      <button class="alert-close" onclick="this.parentElement.remove()">×</button>
    `
    container.appendChild(alert)
    setTimeout(() => alert.remove(), 5000)
  }

  // File Preview
  document.getElementById('bagImage').addEventListener('change', (e) => {
    const file = e.target.files[0]
    const preview = document.getElementById('filePreview')

    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        showAlert('File too large! Max 5MB.', 'error')
        e.target.value = ''
        preview.textContent = ''
        return
      }
      preview.innerHTML = `<strong>✓ Selected:</strong> ${file.name}`
    } else {
      preview.textContent = ''
    }
  })

  // Form Submission
  document.getElementById('bagForm').addEventListener('submit', async (e) => {
    e.preventDefault()

    const submitBtn = document.getElementById('submitBtn')
    const originalText = submitBtn.textContent

    try {
      submitBtn.disabled = true
      submitBtn.innerHTML = '<span class="spinner"></span>Uploading...'

      const name = document.getElementById('bagName').value.trim()
      const price = parseInt(document.getElementById('bagPrice').value)
      const category = document.getElementById('bagCategory').value
      const badge = document.getElementById('bagBadge').value.trim()
      const file = document.getElementById('bagImage').files[0]

      // Validate
      if (!file || !name || !price || !category) {
        throw new Error('Please fill in all required fields')
      }

      // 1. Upload image
      const fileName = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
      const { error: uploadError } = await supabase.storage
        .from('products')
        .upload(fileName, file)

      if (uploadError) {
        throw new Error(`Upload failed: ${uploadError.message}`)
      }

      // 2. Get public URL
      const { data: urlData } = supabase.storage
        .from('products')
        .getPublicUrl(fileName)

      if (!urlData?.publicUrl) {
        throw new Error('Failed to get image URL')
      }

      // 3. Insert into database
      const { error: insertError } = await supabase.from('Products').insert([
        {
          name,
          price,
          category,
          image_url: urlData.publicUrl,
          badge: badge || null
        }
      ])

      if (insertError) {
        throw new Error(`Database error: ${insertError.message}`)
      }

      showAlert('✓ Bag uploaded successfully!', 'success')
      e.target.reset()
      document.getElementById('filePreview').textContent = ''
      await loadProducts()

    } catch (error) {
      console.error('Error:', error)
      showAlert(error.message, 'error')
    } finally {
      submitBtn.disabled = false
      submitBtn.textContent = originalText
    }
  })

  // Load Products
  async function loadProducts() {
    try {
      const { data, error } = await supabase
        .from('Products')
        .select('id, name, price, category, image_url, badge, created_at')
        .order('created_at', { ascending: false })

      if (error) {
        throw new Error(error.message)
      }

      const container = document.getElementById('productsContainer')

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1;">
            <div class="empty-state">
              <p>🎀 No bags yet!</p>
              <p style="font-size: 0.9rem; color: #bbb;">Add your first bag using the form above</p>
            </div>
          </div>
        `
        return
      }

      container.innerHTML = data.map(product => `
        <div class="product-item">
          <img 
            src="${product.image_url}" 
            alt="${product.name}" 
            class="product-image-admin"
            onerror="this.src='https://via.placeholder.com/300?text=Bag'"
          >
          <div class="product-details">
            <div class="product-name-admin">${escapeHtml(product.name)}</div>
            <div class="product-meta">
              <strong>${escapeHtml(product.category)}</strong>
            </div>
            ${product.badge ? `<div class="product-meta" style="color: var(--primary); font-weight: 600;">🏷️ ${escapeHtml(product.badge)}</div>` : ''}
            <div class="product-price-admin">₦${Number(product.price).toLocaleString()}</div>
            <button class="delete-btn" onclick="deleteBag(${product.id})">Delete</button>
          </div>
        </div>
      `).join('')

    } catch (error) {
      console.error('Error:', error)
      document.getElementById('productsContainer').innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; color: #F44336; padding: 40px;">
          Error loading bags: ${error.message}
        </div>
      `
    }
  }

  // Delete Product
  async function deleteBag(id) {
    if (!confirm('Delete this bag permanently?')) return

    try {
      const { data: product, error: fetchError } = await supabase
        .from('Products')
        .select('image_url')
        .eq('id', id)
        .single()

      if (fetchError) throw fetchError

      await supabase.from('Products').delete().eq('id', id)

      if (product?.image_url) {
        try {
          const url = new URL(product.image_url)
          const fileName = url.pathname.split('/').pop()
          await supabase.storage.from('products').remove([fileName])
        } catch (err) {
          console.warn('Could not delete image:', err)
        }
      }

      showAlert('✓ Bag deleted successfully', 'success')
      await loadProducts()

    } catch (error) {
      console.error('Delete error:', error)
      showAlert(`Delete failed: ${error.message}`, 'error')
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div')
    div.textContent = text
    return div.innerHTML
  }

  // Initial load
  loadProducts()
</script>

</body>
</html>
